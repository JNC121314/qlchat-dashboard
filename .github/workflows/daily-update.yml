name: qlchat 武汉-6元 渠道日报

on:
  schedule:
    # 北京时间 9/11/15/19/22 点 = UTC 1/3/7/14
    - cron: '0 1,3,7,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 拉取数据（昨日 + 当月累计 + 历史回退）
        env:
          TZ: Asia/Shanghai
          QLCHAT_SA_TOKEN: ${{ secrets.QLCHAT_SA_TOKEN }}
        run: |
          YESTERDAY=$(date -d 'yesterday' '+%Y-%m-%d')
          FIRST_OF_MONTH=$(date '+%Y-%m-01')
          FIRST_OF_LAST_MONTH=$(date -d 'last month' '+%Y-%m-01' 2>/dev/null || date -d '1 month ago' '+%Y-%m-01')
          echo "📅 拉取: $FIRST_OF_MONTH ~ $YESTERDAY (明细)"
          python fetch_qlchat_data.py --start "$FIRST_OF_MONTH" --end "$YESTERDAY" || {
            echo "⚠️ 区间失败, 降级到昨日单日"
            python fetch_qlchat_data.py --auto
          }
          # 若当月无数据，回退到上月整月
          RECENT_COUNT=$(ls -1 data/raw_${FIRST_OF_MONTH}_*_N.json 2>/dev/null | head -1 | xargs -I {} python3 -c "import json; print(len(json.load(open('{}'))['data'] or []))" 2>/dev/null || echo "0")
          if [ "$RECENT_COUNT" = "0" ]; then
            echo "⚠️ 当月无数据, 回退到上月: $FIRST_OF_LAST_MONTH ~ $(date -d 'last day of last month' '+%Y-%m-%d' 2>/dev/null || echo "$YESTERDAY")"
            LAST_MONTH_END=$(date -d 'last day of last month' '+%Y-%m-%d' 2>/dev/null || date '+%Y-%m-%d')
            python fetch_qlchat_data.py --start "$FIRST_OF_LAST_MONTH" --end "$LAST_MONTH_END" || true
          fi
          echo "📅 拉取: $YESTERDAY (汇总)"
          python fetch_qlchat_data.py --date "$YESTERDAY" --isSummary Y || true

      - name: 生成报告
        env:
          TZ: Asia/Shanghai
        run: python generate_report.py

      - name: 准备部署文件
        run: |
          mkdir -p publish
          if [ ! -f "publish/index.html" ] || [ $(stat -c%s publish/index.html 2>/dev/null || stat -f%z publish/index.html) -lt 1000 ]; then
            echo "❌ 报告文件未生成或过小"
            ls -la publish/ || true
            exit 1
          fi
          echo "✅ 报告已准备 ($(stat -c%s publish/index.html 2>/dev/null || stat -f%z publish/index.html) bytes)"

      - name: 部署到 GitHub Pages
        env:
          TZ: Asia/Shanghai
        run: |
          # 使用 orphan 分支确保 gh-pages 只含发布文件
          git config user.name "WorkBuddy Bot"
          git config user.email "auto@workbuddy.dev"
          cp publish/index.html /tmp/_index.html
          cp publish/push_content.html /tmp/_push_content.html
          # 进入临时目录创建 orphan 分支
          cd ..
          rm -rf /tmp/gh-pages-deploy
          mkdir /tmp/gh-pages-deploy
          cd /tmp/gh-pages-deploy
          git init -b gh-pages
          git config user.name "WorkBuddy Bot"
          git config user.email "auto@workbuddy.dev"
          touch .nojekyll
          cp /tmp/_index.html index.html
          cp /tmp/_push_content.html push_content.html
          git add .nojekyll index.html push_content.html
          git commit -m "deploy: $(date '+%Y-%m-%d %H:%M')"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/JNC121314/qlchat-dashboard.git gh-pages

      - name: 微信推送通知
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "
          import json, os, urllib.request, glob
          tokens_str = os.environ.get('PUSHPLUS_TOKEN', '')
          tokens = [t.strip() for t in tokens_str.split(',') if t.strip()]
          status = os.environ.get('JOB_STATUS', 'unknown')

          if not tokens:
              print('⚠️ PUSHPLUS_TOKEN 未配置')
              exit(0)

          push_html = ''
          try:
              with open('publish/push_content.html', 'r', encoding='utf-8') as f:
                  push_html = f.read()
          except Exception as e:
              print(f'读取推送内容失败: {e}')

          if status == 'success' and push_html:
              content = push_html
              title = '✅ qlchat 渠道日报已更新'
          elif status == 'success':
              content = '📊 qlchat 渠道日报已更新<br>查看: <a href=https://qlchat-dashboard.pages.dev>https://qlchat-dashboard.pages.dev</a>'
              title = '✅ qlchat 渠道日报已更新'
          else:
              # 失败原因诊断
              report_ok = os.path.exists('publish/index.html') and os.path.getsize('publish/index.html') > 1000
              data_ok = bool(glob.glob('data/raw_*.json'))
              if not data_ok:
                  reason = '数据拉取失败(可能是 sa-token 过期, 需重新登录)'
              elif report_ok:
                  reason = '部署失败(Cloudflare Pages上传异常)'
              else:
                  reason = '报告生成失败(脚本错误或数据格式异常)'
              content = f'qlchat 渠道日报更新失败<br>原因: {reason}<br><br>查看日志: <a href=https://github.com/JNC121314/qlchat-dashboard/actions>GitHub Actions</a>'
              title = '⚠️ qlchat 渠道日报更新失败'

          for token in tokens:
              data = json.dumps({'token': token, 'title': title, 'content': content, 'template': 'html'}).encode('utf-8')
              req = urllib.request.Request('https://www.pushplus.plus/send', data=data, headers={'Content-Type': 'application/json'})
              try:
                  resp = urllib.request.urlopen(req, timeout=15)
                  result = json.loads(resp.read())
                  code = result.get('code')
                  if code == 200:
                      print(f'✅ 推送成功: {token[:12]}...')
                  else:
                      print(f'❌ 推送失败: {token[:12]}... code={code}')
              except Exception as e:
                  print(f'❌ 推送异常: {e}')
          "
